[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parliamentary-nlp-mcp"
version = "0.1.0"
description = "MCP server for auditing parliamentary discourse with BERTimbau-based NLP and uncertainty quantification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Alisson Oliveira" },
]
keywords = [
    "mcp",
    "nlp",
    "bertimbau",
    "hate-speech",
    "parliamentary",
    "portuguese",
    "uncertainty",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "torch>=2.0.0",
    "transformers>=4.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
parliamentary-nlp-mcp = "parliamentary_nlp.server:main"

[project.urls]
Homepage = "https://github.com/alissonf216/parliamentary-nlp-mcp"
Repository = "https://github.com/alissonf216/parliamentary-nlp-mcp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
